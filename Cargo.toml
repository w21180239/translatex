[package]
name = "translatex"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
description = "Free translation CLI for AI agents: no API key, no signup, no config. 26 providers raced in parallel, structured JSON, key rotation, de-AI rewriting."
license = "MIT OR Apache-2.0"
repository = "https://github.com/w21180239/translatex"
homepage = "https://github.com/w21180239/translatex"
documentation = "https://github.com/w21180239/translatex#readme"
keywords = ["translation", "cli", "agent", "i18n", "free"]
categories = ["command-line-utilities", "web-programming", "text-processing"]
readme = "README.md"
exclude = ["npm", "repo-assets", ".github", ".claude-plugin"]

[lib]
name = "translatex"
path = "src/lib.rs"

[[bin]]
name = "translatex"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
cipher = { version = "0.4", features = ["alloc", "std"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
config = { version = "0.14", default-features = false, features = ["toml"] }
dashmap = "6"
des = "0.8"
directories = "5"
ecb = "0.1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
keyring = "3"
once_cell = "1"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream", "cookies"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "fs", "process"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
